<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>SHOPPING LIST MANAGER</h1>
    <div id="container">
        <input type="text" id="textbox1" placeholder="Enter item name">
        <input type="number" id="textbox2" placeholder="Enter quantity">
        <select id="category">
            <option value="Diary">Diary</option>
            <option value="Bakery">Bakery</option>
            <option value="Others">Others</option>
        </select>
        <button id="add-button" onclick="add()">Add Item</button>
        <button id="remove-button" onclick="remove()">Remove Item</button>
        <button id="sort-button" onclick="sortItem()">Sort Items</button>
        <h4 id="list"></h4><br>
        <h3 id="category-list">Items by category:</h3>
        <p id="c1">Diary:</p>
        <p id="c2">Bakery:</p>
        <p id="c3">Others:</p>
    </div>


    <script src="script.js"></script>
</body>
</html>
